[package]
name = "solver-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Single-threaded WebAssembly wrapper around b-inary/postflop-solver for Poker GTO Trainer"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Pinned: development of postflop-solver was suspended in Oct 2023.
# No default features: no rayon (single-threaded, no SharedArrayBuffer needed), no bincode/zstd.
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509fe5077d019825f833eed04b16d342dfda1", default-features = false }
wasm-bindgen = "=0.2.129"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals"]
